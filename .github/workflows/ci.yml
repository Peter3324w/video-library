name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # google-config.js holds the OAuth keys and is gitignored; the example stands in.
      - run: cp src/main/google-config.example.js src/main/google-config.js
      - name: Build
        run: npm run build
      - name: Build the web version
        run: npm run build:web
      - name: Test the file-name rules
        run: node scripts/test-matching.mjs
      - name: Test the sync merge rules
        run: node scripts/test-sync.mjs
