<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' data: https: vlart:; script-src 'self' 'unsafe-inline' 'unsafe-eval'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Library</title>
    <style>
      /* Paints on the first frame, before the JS bundle loads, so a cold start
         never shows a blank canvas. Removed by main.jsx once React mounts. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        transition: opacity 0.35s ease;
      }
      #boot-splash.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      html,
      body {
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
