appId: com.peter3324w.videolibrary
productName: Video Library

directories:
  buildResources: build
  output: release

# out/ is the electron-vite bundle. Dependencies (koffi and its win32 addon)
# are added by electron-builder itself; the .node addon is unpacked from the
# asar automatically, since Windows can't load a DLL from inside an archive.
files:
  - out/**/*
  - package.json

# Package the Electron already in node_modules instead of downloading another
# copy: GitHub's release-asset CDN is unroutable on this connection.
electronDist: node_modules/electron/dist

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Video Library
