<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Library — icon options</title>
<style>
  :root {
    --bg: #050505;
    --card: #101010;
    --stroke: rgba(255, 255, 255, 0.08);
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --desk: #0b0b0b;
  }
  body.light-desk { --desk: #e9edf2; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 'Segoe UI', system-ui, sans-serif;
    padding: 48px clamp(16px, 4vw, 56px) 80px;
  }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 36px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  header p { color: var(--muted); margin-top: 6px; max-width: 620px; }
  .toggle { display: flex; background: var(--card); border: 1px solid var(--stroke); border-radius: 999px; padding: 4px; }
  .toggle button {
    border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  .toggle button.on { background: #fff; color: #000; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--stroke); border-radius: 24px;
    padding: 22px; display: flex; flex-direction: column; gap: 16px;
    transition: border-color 0.2s, transform 0.2s;
  }
  .card:hover { border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
  .hero {
    background: var(--desk); border-radius: 18px; aspect-ratio: 16 / 10;
    display: flex; align-items: center; justify-content: center; transition: background 0.2s;
  }
  .hero svg { width: 46%; height: auto; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.45)); }
  .num { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; }
  .name { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .idea { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .sizes {
    display: flex; align-items: end; gap: 18px; padding: 14px 16px;
    background: var(--desk); border-radius: 14px; transition: background 0.2s;
  }
  .sizes figure { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sizes figcaption { font-size: 10px; color: var(--muted); font-weight: 600; }
  /* The taskbar: where the icon actually lives, at 24px, among neighbours. */
  .taskbar {
    position: sticky; bottom: 16px; margin-top: 40px; display: flex; align-items: center; gap: 6px;
    background: rgba(32, 32, 32, 0.85); backdrop-filter: blur(20px); border: 1px solid var(--stroke);
    border-radius: 14px; padding: 8px 12px; overflow-x: auto; width: fit-content; max-width: 100%;
  }
  body.light-desk .taskbar { background: rgba(243, 243, 243, 0.9); }
  .taskbar .slot { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; cursor: pointer; position: relative; }
  .taskbar .slot:hover, .taskbar .slot.on { background: rgba(127, 127, 127, 0.2); }
  .taskbar .slot.on::after { content: ''; position: absolute; bottom: 2px; width: 14px; height: 3px; border-radius: 2px; background: #60a5fa; }
  .taskbar .label { font-size: 12px; color: var(--muted); padding: 0 10px; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Video Library: icon options</h1>
    <p>Twelve directions. Each one is shown large, then at the real Windows sizes: 48px (desktop), 32px (Start, Alt+Tab), 16px (title bar). The 16px one is the hard test. Taskbar at the bottom, 24px, next to real neighbours.</p>
  </div>
  <div class="toggle" role="group" aria-label="Desktop background">
    <button class="on" data-desk="dark">Dark desktop</button>
    <button data-desk="light">Light desktop</button>
  </div>
</header>

<main class="grid" id="grid"></main>

<div class="taskbar" id="taskbar"><span class="label">Taskbar, 24px. Hover to compare</span></div>

<script>
let n = 0
const uid = () => 'i' + n++

/* The shared tile: the app's own language, a soft rounded square with a
   faint top sheen and a hairline edge. Colours vary per concept. */
function tile(id, top, bot, { sheen = 0.05, edge = 0.12 } = {}) {
  return `
    <defs><linearGradient id="${id}t" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/>
    </linearGradient></defs>
    <rect width="256" height="256" rx="56" fill="url(#${id}t)"/>
    <rect x="6" y="6" width="244" height="118" rx="50" fill="rgba(255,255,255,${sheen})"/>
    <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="rgba(255,255,255,${edge})" stroke-width="1.5"/>`
}
const svg = (body) => `<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">${body}</svg>`
// A play triangle with softened corners, centred on (cx, cy).
const play = (cx, cy, s, fill) => {
  const w = s * 0.9, h = s
  const x0 = cx - w * 0.4, x1 = cx + w * 0.6
  return `<path d="M${x0} ${cy - h / 2} L${x1} ${cy} L${x0} ${cy + h / 2} Z" fill="${fill}" stroke="${fill}" stroke-width="${s * 0.14}" stroke-linejoin="round"/>`
}

const ICONS = [
  {
    name: 'Frame',
    idea: 'Today’s mark, refined: a screen and a play button. Safe, and reads at any size.',
    draw: (id) => tile(id, '#232323', '#060606') + `
      <rect x="58" y="70" width="140" height="116" rx="22" fill="none" stroke="#fff" stroke-width="15"/>
      ${play(128, 128, 46, '#fff')}`
  },
  {
    name: 'Bookmark',
    idea: 'It remembers where you stopped. A ribbon marking your place, with play cut into it.',
    draw: (id) => tile(id, '#232323', '#060606') + `
      <defs><linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
      <path d="M86 50 H170 a14 14 0 0 1 14 14 V206 L128 170 L72 206 V64 a14 14 0 0 1 14 -14 Z" fill="url(#${id}b)"/>
      ${play(128, 112, 40, '#1a1206')}`
  },
  {
    name: 'Resume ring',
    idea: 'A progress ring three-quarters full around play. The whole app in one shape: where you got to.',
    draw: (id) => tile(id, '#232323', '#060606') + `
      <circle cx="128" cy="128" r="72" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="18"/>
      <circle cx="128" cy="128" r="72" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"
        stroke-dasharray="${2 * Math.PI * 72 * 0.72} 999" transform="rotate(-90 128 128)"/>
      ${play(128, 128, 50, '#fff')}`
  },
  {
    name: 'Stack',
    idea: 'Posters stacked like a shelf you flick through. It says “library” before it says “player”.',
    draw: (id) => tile(id, '#232323', '#060606') + `
      <rect x="52" y="62" width="96" height="134" rx="14" fill="rgba(255,255,255,.22)" transform="rotate(-10 100 129)"/>
      <rect x="76" y="58" width="96" height="134" rx="14" fill="rgba(255,255,255,.48)" transform="rotate(-3 124 125)"/>
      <rect x="104" y="60" width="96" height="134" rx="14" fill="#fff" transform="rotate(5 152 127)"/>
      <g transform="rotate(5 152 127)">${play(152, 127, 36, '#0a0a0a')}</g>`
  },
  {
    name: 'Clapper',
    idea: 'The classic film slate, flattened and rounded. Instantly “movies”, with an accent on the clap.',
    draw: (id) => tile(id, '#232323', '#060606') + `
      <rect x="52" y="108" width="152" height="98" rx="16" fill="#fff"/>
      <g transform="rotate(-14 56 104)">
        <rect x="52" y="76" width="152" height="32" rx="8" fill="#38bdf8"/>
        <path d="M76 76 L96 76 L82 108 L62 108 Z M120 76 L140 76 L126 108 L106 108 Z M164 76 L184 76 L170 108 L150 108 Z" fill="#06202e"/>
      </g>
      ${play(128, 157, 34, '#0a0a0a')}`
  },
  {
    name: 'Spines',
    idea: 'Video spines on a shelf, each a different colour. One stands taller, the one you’re watching.',
    draw: (id) => tile(id, '#1d1d1d', '#050505') + `
      <rect x="54" y="92" width="24" height="104" rx="7" fill="#38bdf8"/>
      <rect x="84" y="78" width="24" height="118" rx="7" fill="#f472b6"/>
      <rect x="114" y="52" width="30" height="144" rx="8" fill="#fff"/>
      <rect x="150" y="86" width="24" height="110" rx="7" fill="#8ce563"/>
      <rect x="180" y="100" width="22" height="96" rx="7" fill="#e8b075" transform="rotate(10 191 196)"/>
      <rect x="48" y="200" width="160" height="8" rx="4" fill="rgba(255,255,255,.3)"/>
      ${play(129, 84, 18, '#0a0a0a')}`
  },
  {
    name: 'Scrubber',
    idea: 'A screen with its own progress bar and a knob where you left off. Reads as “resume” at a glance.',
    draw: (id) => tile(id, '#232323', '#060606') + `
      <rect x="48" y="56" width="160" height="106" rx="20" fill="#fff"/>
      ${play(128, 109, 38, '#0a0a0a')}
      <rect x="48" y="186" width="160" height="12" rx="6" fill="rgba(255,255,255,.18)"/>
      <rect x="48" y="186" width="104" height="12" rx="6" fill="#f472b6"/>
      <circle cx="152" cy="192" r="15" fill="#fff"/>`
  },
  {
    name: 'Play-V',
    idea: 'A play button turned on its side becomes a V: “Video”, and play, in one stroke. On sky blue.',
    draw: (id) => tile(id, '#4cc3ff', '#2563eb', { sheen: 0.12, edge: 0.25 }) + `
      <path d="M62 74 L194 74 L128 190 Z" fill="#fff" stroke="#fff" stroke-width="22" stroke-linejoin="round"/>
      <path d="M100 96 L156 96 L128 146 Z" fill="#2f7cf0" stroke="#2f7cf0" stroke-width="8" stroke-linejoin="round"/>`
  },
  {
    name: 'Lens',
    idea: 'A camera lens in rings of glass, with play at the centre. Deep violet; feels premium.',
    draw: (id) => tile(id, '#4c1d95', '#0b0420', { sheen: 0.08, edge: 0.2 }) + `
      <defs><radialGradient id="${id}l" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#c4b5fd"/><stop offset="0.55" stop-color="#7c3aed"/><stop offset="1" stop-color="#1e0b4b"/></radialGradient></defs>
      <circle cx="128" cy="128" r="82" fill="#0a0418" stroke="rgba(255,255,255,.25)" stroke-width="4"/>
      <circle cx="128" cy="128" r="64" fill="url(#${id}l)"/>
      <circle cx="128" cy="128" r="64" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2"/>
      <ellipse cx="104" cy="100" rx="18" ry="11" fill="rgba(255,255,255,.35)" transform="rotate(-30 104 100)"/>
      ${play(128, 130, 38, '#fff')}`
  },
  {
    name: 'Rewatch',
    idea: 'A circular arrow around play: your history, and going back to it. Green, like a finished episode.',
    draw: (id) => tile(id, '#232323', '#060606') + `
      <path d="M71 102 A64 64 0 1 1 74 162" fill="none" stroke="#8ce563" stroke-width="18" stroke-linecap="round"/>
      <path d="M52 78 L74 112 L102 86 Z" fill="#8ce563" stroke="#8ce563" stroke-width="8" stroke-linejoin="round"/>
      ${play(132, 128, 46, '#fff')}`
  },
  {
    name: 'Matinee',
    idea: 'A tiny poster: sunset, hills, and a watched bar along the bottom. The most cinematic of the set.',
    draw: (id) => `
      <defs>
        <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1458"/><stop offset="0.5" stop-color="#e2467a"/><stop offset="1" stop-color="#ffb35c"/></linearGradient>
        <clipPath id="${id}c"><rect width="256" height="256" rx="56"/></clipPath>
      </defs>
      <g clip-path="url(#${id}c)">
        <rect width="256" height="256" fill="url(#${id}s)"/>
        <circle cx="128" cy="150" r="54" fill="#ffe0a3"/>
        <path d="M0 168 Q64 128 128 160 T256 150 V256 H0 Z" fill="#1b0c33"/>
        <path d="M0 196 Q80 170 160 192 T256 186 V256 H0 Z" fill="#0d0620"/>
        <rect x="34" y="214" width="188" height="10" rx="5" fill="rgba(255,255,255,.25)"/>
        <rect x="34" y="214" width="122" height="10" rx="5" fill="#fff"/>
      </g>
      <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>`
  },
  {
    name: 'Ticket',
    idea: 'A golden admit-one stub, perforated, with play on the tear-off. Warm and a little playful.',
    draw: (id) => tile(id, '#232323', '#060606') + `
      <defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#e8a33c"/></linearGradient></defs>
      <g transform="rotate(-12 128 128)">
        <path d="M44 84 H212 V112 a16 16 0 0 0 0 32 V172 H44 V144 a16 16 0 0 0 0 -32 Z" fill="url(#${id}g)"/>
        <path d="M160 92 V164" stroke="#7a4b0c" stroke-width="5" stroke-dasharray="8 8" stroke-linecap="round"/>
        ${play(186, 128, 26, '#3d2405')}
        <rect x="66" y="112" width="70" height="10" rx="5" fill="rgba(61,36,5,.55)"/>
        <rect x="66" y="132" width="46" height="10" rx="5" fill="rgba(61,36,5,.35)"/>
      </g>`
  }
]

const grid = document.getElementById('grid')
const bar = document.getElementById('taskbar')
// Neighbours on the taskbar, so each option is judged in company.
const neighbours = [
  svg(`<rect x="28" y="28" width="200" height="200" rx="20" fill="#0078d4"/><rect x="40" y="40" width="84" height="84" fill="#fff"/><rect x="132" y="40" width="84" height="84" fill="#fff"/><rect x="40" y="132" width="84" height="84" fill="#fff"/><rect x="132" y="132" width="84" height="84" fill="#fff"/>`),
  svg(`<circle cx="128" cy="128" r="104" fill="#f2b705"/><circle cx="128" cy="128" r="48" fill="#1a73e8"/><path d="M128 24 A104 104 0 0 1 218 76 L170 104 A48 48 0 0 0 128 80 Z" fill="#ea4335"/>`),
  svg(`<rect x="24" y="48" width="208" height="160" rx="24" fill="#f6c443"/><rect x="24" y="80" width="208" height="128" rx="20" fill="#ffd968"/>`)
]
for (const s of neighbours) bar.insertAdjacentHTML('beforeend', `<div class="slot">${s.replace('<svg', '<svg width="24" height="24"')}</div>`)

ICONS.forEach((ic, i) => {
  const big = svg(ic.draw(uid()))
  const sized = (px) => `<figure>${svg(ic.draw(uid())).replace('<svg', `<svg width="${px}" height="${px}"`)}<figcaption>${px}</figcaption></figure>`
  grid.insertAdjacentHTML('beforeend', `
    <article class="card">
      <div class="hero">${big}</div>
      <div>
        <div class="num">${String(i + 1).padStart(2, '0')}</div>
        <div class="name">${ic.name}</div>
        <p class="idea">${ic.idea}</p>
      </div>
      <div class="sizes">${sized(48)}${sized(32)}${sized(16)}</div>
    </article>`)
  bar.insertAdjacentHTML('beforeend',
    `<div class="slot ${i === 0 ? 'on' : ''}" title="${i + 1}. ${ic.name}">${svg(ic.draw(uid())).replace('<svg', '<svg width="24" height="24"')}</div>`)
})

document.querySelectorAll('.toggle button').forEach((b) =>
  b.addEventListener('click', () => {
    document.querySelectorAll('.toggle button').forEach((x) => x.classList.toggle('on', x === b))
    document.body.classList.toggle('light-desk', b.dataset.desk === 'light')
  })
)
</script>
</body>
</html>
